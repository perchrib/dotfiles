# Reload config file (useful when editing this file, and not really anytime else)
bind r source-file ~/.tmux.conf\; display-message "Config reloaded..."

# Enable full mouse support
set -g mouse on

# Enable focus events, so that tmux can detect when a pane is focused or unfocused
# Neovim uses this to automatically enter and exit insert mode when switching between panes.
set -g focus-events on

# Start windows and panes index at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows on window close
set -g renumber-windows on

# Move status bar to the top
set -g status-position bottom

# Set vim keybindings when in copy mode
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Y send-keys -X copy-end-of-line

# Set clipboard on
set -g set-clipboard on

# Set display panes time to 2 seconds when using prefix + q to show pane numbers
set -g display-panes-time 3000

# Name windows after the git branch (set by a zsh precmd hook in .zshrc as the
# @branch pane option), or the running command when not in a git repo
set -g automatic-rename-format '#{?@branch, #{@branch},#{?pane_in_mode,[tmux],#{pane_current_command}}#{?pane_dead,[dead],}}'

# Open new panes in the same directory
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Pick a git repo (under ~/git, plus ~/dotfiles) in an fzf popup and switch to a
# session for it (named after the repo in uppercase), creating the session if it
# doesn't exist yet
bind g display-popup -E -w 60% -h 50% '\
  repo=$( { echo ~/dotfiles; fd -H -t d --prune --max-depth 4 "^\.git$" ~/git | sed "s|/\.git/*$||"; } \
    | sed "s|^$HOME/||" | sort -u | fzf --prompt="repo> " --reverse) || exit 0; \
  name=$(basename "$repo" | tr . _ | tr "[:lower:]" "[:upper:]"); \
  tmux has-session -t "=$name" 2>/dev/null || tmux new-session -ds "$name" -c "$HOME/$repo"; \
  tmux switch-client -t "=$name"'

# Move between panes using leader + h/j/k/l, like vim
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Clear status bar right side
# set -g status-right ""

# Make active pane more focused by dimming inactive panes and highlighting borders
set -g window-style 'fg=colour247,bg=colour236'
set -g window-active-style 'fg=colour250,bg=black'
set -g pane-border-style 'fg=colour238'
set -g pane-active-border-style 'fg=colour39,bg=default'
set -g pane-border-lines heavy
set -g pane-border-indicators both
# set -g pane-border-indicators colour

# List of plugins
# Install Plugins with leader-I (ctrl-b I)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'dracula/tmux'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
# Enables automatic restore, manually save with leader + Ctrl-s and restore with leader + Ctrl-r
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# Dracula theme plugins, see https://github.com/dracula/tmux
set -g @dracula-time-format " %H:%M | %a %d %b, Week %V"
set -g @dracula-plugins "time battery"
set -g @dracula-show-flags true

# vim-tmux-navigator plugin
set -g @vim_navigator_mapping_left "C-Left C-h"
set -g @vim_navigator_mapping_right "C-Right C-l"
set -g @vim_navigator_mapping_up "C-k"
set -g @vim_navigator_mapping_down "C-j"
set -g @vim_navigator_mapping_prev ""

# workmux plugin
bind Tab run-shell "workmux sidebar"
bind b display-popup -h 60 -w 180 -E "workmux dashboard"
# Initialize TMUX plugin manager
setenv -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"
# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
