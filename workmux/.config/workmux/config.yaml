nerdfont: true
# Use the repos main branch (main or master)
base_branch: auto
panes:
  # 1. Left pane: Opens LazyVim and makes it the active pane
  - command: nvim
    focus: true
    name: editor

  # 2. Right pane: Splits horizontally (side-by-side) for Claude Code
  - command: claude
    split: horizontal
    percentage: 40
    name: claude
